plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hutie.gen'
    compileSdk 34

    defaultConfig {
        applicationId "com.hutie.gen"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
